services:
  task-service:
    env_file:
      - ../.env
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: task-service
    ports:
      - "${WEB_PORT:-9002}:9002"
    environment:
      PORT: 9002
      IDENTITY-SERVICE-ADDR: ${IDENTITY_SERVICE_ADDR:-identity-service:50052}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-task}
      DB_SECRET: ${DB_SECRET:-change-me}
      DB_NAME: ${DB_NAME:-task}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - todo-network

  postgres:
    image: postgres:15-alpine
    container_name: task-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_SECRET}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: |
      postgres 
        -c max_connections=200 
        -c shared_buffers=256MB 
        -c effective_cache_size=768MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - todo-network
      

networks:
  todo-network:
    driver: bridge
    external: true

volumes:
  postgres-data: