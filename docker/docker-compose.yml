services:
  task-service:
    env_file:
      - ../.env
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: task-service
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - todo-network

  postgres:
    image: postgres:15-alpine
    container_name: task-postgres
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_SECRET}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init-db.sql
    command: |
      postgres 
        -c max_connections=200 
        -c shared_buffers=256MB 
        -c effective_cache_size=768MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - todo-network
      

networks:
  todo-network:
    driver: bridge
    external: true

volumes:
  postgres-data: