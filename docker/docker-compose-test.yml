services:
  task-service-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: task-service-test
    ports:
      - "9003:9003"
    environment:
      APP_ENV: test
      PORT: 9003
      IDENTITY-SERVICE-ADDR: "identity-test-app:50052"

      DB_HOST: task-postgres-test
      DB_PORT: 5432
      DB_USER: test
      DB_SECRET: test
      DB_NAME: task-test
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9003/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - todo-test-network

  postgres:
    image: postgres:15-alpine
    container_name: task-postgres-test
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=task-test
    volumes:
      - postgres-task-test-data:/var/lib/postgresql/data
    command: |
      postgres 
        -c max_connections=200 
        -c shared_buffers=256MB 
        -c effective_cache_size=768MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d task-test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - todo-test-network
      
networks:
  todo-test-network:
    external: true

volumes:
  postgres-task-test-data: